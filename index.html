<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Une petite question importante avec une seule bonne réponse."
    />
    <title>Une question pour toi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Pacifico&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="card" aria-labelledby="question">
      <div class="sparkles" aria-hidden="true">✦</div>
      <div class="heart" aria-hidden="true">♥</div>
      <section id="name-step" aria-labelledby="name-title">
        <p class="eyebrow">Une petite surprise</p>
        <h1 id="name-title">Comment t’appelles-tu&nbsp;?</h1>
        <p class="hint">Écris ton prénom pour découvrir la question.</p>
        <form class="name-form" id="name-form">
          <label for="name-input">Ton prénom</label>
          <input id="name-input" name="name" type="text" autocomplete="given-name" maxlength="80" required />
          <button class="button button-yes" type="submit">Continuer&nbsp;→</button>
        </form>
      </section>

      <section id="question-step" aria-labelledby="question" hidden>
        <p class="eyebrow">J’ai une question pour toi</p>
        <h1 id="question">Veux-tu être mon/ma partenaire d’aventure ?</h1>
        <p class="hint" id="hint">Réfléchis bien… il n’y a qu’une bonne réponse&nbsp;☺</p>
        <label class="comment-label" for="comment-input">Un commentaire&nbsp;? <span>(facultatif)</span></label>
        <textarea id="comment-input" maxlength="500" placeholder="Écris un petit mot si tu veux…"></textarea>

        <div class="actions" id="actions">
          <button class="button button-yes" id="yes-button" type="button">Oui&nbsp;! 💖</button>
          <button class="button button-no" id="no-button" type="button">Non</button>
        </div>
      </div>

      <p class="success" id="success" role="status" aria-live="polite" hidden>
        <span aria-hidden="true">🎉</span>
        <span class="success-content">
          <strong id="success-message">Je savais que tu dirais oui&nbsp;! Merci pour ta réponse 💌</strong>
          <span class="submission-summary" id="submission-summary"></span>
        </span>
      </p>
      <p class="error" id="error" role="alert" hidden></p>
      <p class="credit">Fait avec beaucoup de ♥</p>
    </main>
  </body>
</html>
